name = "tk-portfolio-client"
pages_build_output_dir = "client/dist"

[build]
command = "cd client && npm ci && npm run build"

[env.variables]
NODE_VERSION = "20"
VITE_API_BASE = "https://your-api.onrender.com/api"

# Optional: Custom headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Optional: Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200