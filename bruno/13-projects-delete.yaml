info:
  name: Delete Project
  type: http
  seq: 13
  tags:
    - auth
http:
  method: DELETE
  url: http://localhost:5000/api/projects/{{project_id}}
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
settings:
  encodeUrl: true
runtime:
  scripts:
    - type: after-response
      code: |-
        test("delete project returns 200", () => {
          expect(res.getStatus()).to.equal(200);
        });
        test("body ok is true", () => {
          expect(res.getBody().ok).to.equal(true);
        });
